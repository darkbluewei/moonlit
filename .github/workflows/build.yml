name: Build macOS app

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: bash build.sh
      - name: Zip
        run: cd build && ditto -c -k --keepParent MacTaskManager.app ../MacTaskManager.zip
      - uses: actions/upload-artifact@v4
        with:
          name: MacTaskManager
          path: MacTaskManager.zip

